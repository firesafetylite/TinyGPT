name: Nightly

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish rolling nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out nightly source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Zig toolchain
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.14.1
          python -m ziglang version

      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python tinygpt --help

      - name: Build nightly image
        env:
          TINYGPT_BUILD_CHANNEL: nightly
        run: make

      - name: Read and validate build version
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import runpy
          from pathlib import Path

          updater = runpy.run_path("tinygpt", run_name="nightly_validation")
          efi = Path("build/BOOTAA64.EFI").read_bytes()
          version = updater["validate_efi"](efi)
          assert updater["embedded_channel"](efi) == "nightly"
          assert b"TinyGPT nightly\narchitecture=ARM64" in efi
          image = Path("build/TinyGPT.img").read_bytes()
          assert len(image) == 128 * 1024 * 1024
          recovery = updater["Fat32Image"](image, 0)
          system = updater["Fat32Image"](image, 1)
          assert recovery.read_file(updater["BOOT_PATH"]) == efi
          assert system.read_file((b"TINYGPT NEW",)) == b"Initialize TinyGPT on first boot\n"
          assert system.read_file((b"DOOMU   WAD",)).startswith(b"IWAD")
          print(version)
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package nightly assets
        env:
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          efi_name="TinyGPT-nightly-BOOTAA64.EFI"
          mkdir -p dist
          cp build/BOOTAA64.EFI "dist/${efi_name}"
          cp build/TinyGPT.img "dist/TinyGPT-nightly.img"
          cp tinygpt dist/tinygpt
          chmod +x dist/tinygpt
          zip -9 "dist/TinyGPT-nightly-LICENSES.zip" \
            LICENSE THIRD_PARTY_NOTICES.md \
            firmware/licenses/EDK2-LICENSE.txt \
            firmware/licenses/LIBFDT-LICENSE.txt \
            firmware/licenses/OPENSSL-LICENSE.txt \
            third_party/PureDOOM/LICENSE \
            third_party/console-font/LICENSE.txt \
            assets/FREEDOOM-COPYING.txt \
            assets/FREEDOOM-CREDITS.txt \
            assets/FREEDOOM-CREDITS-MUSIC.txt \
            assets/FREEDOOM-README.html
          efi_size="$(stat -c '%s' "dist/${efi_name}")"
          efi_sha256="$(sha256sum "dist/${efi_name}" | cut -d ' ' -f 1)"
          cat > dist/TinyGPT-nightly-update.txt <<EOF
          version=${VERSION}
          size=${efi_size}
          sha256=${efi_sha256}
          url=https://firesafetylite.github.io/TinyGPT/nightly/TinyGPT-latest-BOOTAA64.EFI
          EOF
          (
            cd dist
            test "$(grep -c '^' TinyGPT-nightly-update.txt)" -eq 4
            sha256sum TinyGPT-* tinygpt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create or replace rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly \
              dist/TinyGPT-nightly.img \
              dist/TinyGPT-nightly-LICENSES.zip \
              dist/tinygpt \
              --clobber
            gh release upload nightly dist/TinyGPT-nightly-BOOTAA64.EFI --clobber
            gh release upload nightly dist/SHA256SUMS --clobber
            gh release upload nightly dist/TinyGPT-nightly-update.txt --clobber
            gh release edit nightly \
              --title "TinyGPT nightly" \
              --notes "Rolling beta build from the nightly branch at ${GITHUB_SHA}." \
              --prerelease
          else
            gh release create nightly dist/* \
              --verify-tag \
              --title "TinyGPT nightly" \
              --notes "Rolling beta build from the nightly branch at ${GITHUB_SHA}." \
              --prerelease
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=nightly-published
