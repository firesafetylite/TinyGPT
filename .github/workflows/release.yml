name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require explicit promotion through main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Stable releases must be tagged from the main branch." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Zig toolchain
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.14.1
          python -m ziglang version

      - name: Test host update command
        run: |
          python -m unittest discover -s tests -v
          python tinygpt --help

      - name: Rebuild from source
        run: make

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/BOOTAA64.EFI
          test "$(stat -c '%s' build/TinyGPT.img)" -eq 134217728
          test ! -e build/TinyGPT.utm
          test ! -e build/TinyGPT-UTM.img
          file build/BOOTAA64.EFI | grep -Eq 'PE32\+ executable.*Aarch64'
          strings build/BOOTAA64.EFI | grep -Fq 'update [check] [main|nightly]'
          strings build/BOOTAA64.EFI | grep -Fq 'Checking the '
          strings build/BOOTAA64.EFI | grep -Fq 'nightly/TinyGPT-update.txt'
          strings build/BOOTAA64.EFI | grep -Fq 'UTM Shared Network fallback configured; continuing automatically.'
          strings build/BOOTAA64.EFI | grep -Fq 'Network fallback is still initializing; retrying automatically...'
          strings build/BOOTAA64.EFI | grep -Fq '=== TinyGPT Settings ==='
          strings build/BOOTAA64.EFI | grep -Fq 'settings             open the full-screen persistent settings UI'
          strings build/BOOTAA64.EFI | grep -Fq 'The pre-OS environment remains and will open at the next boot.'
          strings build/BOOTAA64.EFI | grep -Fq '=== TinyGPT Pre-OS Environment ==='
          strings build/BOOTAA64.EFI | grep -Fq 'Up/Down select, Enter boot, S save default, R recovery'
          strings build/BOOTAA64.EFI | grep -Fq 'partition add MIB NAME'
          strings build/BOOTAA64.EFI | grep -Fq 'repair N         repair or install TinyGPT'
          ! strings build/BOOTAA64.EFI | grep -Fq 'bootmgr              open'
          ! strings build/BOOTAA64.EFI | grep -Fq 'Recovery Agent'
          ! strings build/BOOTAA64.EFI | grep -Fq 'command: recovery'
          strings build/BOOTAA64.EFI | grep -Fq 'scan N           verify a partition'
          strings build/BOOTAA64.EFI | grep -Fq 'scan: active file integrity verified'
          strings build/BOOTAA64.EFI | grep -Fq 'The running shell remains TinyGPT'
          python - <<'PY'
          import os
          import runpy
          from pathlib import Path

          updater = runpy.run_path("tinygpt", run_name="release_validation")
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.startswith("v")
          efi = Path("build/BOOTAA64.EFI").read_bytes()
          updater["validate_efi"](efi, tag[1:])
          assert updater["embedded_channel"](efi) == "main"
          image = Path("build/TinyGPT.img").read_bytes()
          assert image[512:520] == b"EFI PART"
          assert image[2048 * 512 + 54:2048 * 512 + 62] == b"FAT16   "
          assert image[34816 * 512 + 82:34816 * 512 + 90] == b"FAT32   "
          recovery = updater["Fat32Image"](image, 0)
          system = updater["Fat32Image"](image, 1)
          assert recovery.read_file(updater["BOOT_PATH"]) == efi
          assert system.read_file((b"TINYGPT NEW",)) == b"Initialize TinyGPT on first boot\n"
          assert system.read_file((b"DOOMU   WAD",)).startswith(b"IWAD")
          PY

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          efi_name="TinyGPT-${tag}-BOOTAA64.EFI"
          mkdir -p dist
          cp build/BOOTAA64.EFI "dist/${efi_name}"
          cp build/TinyGPT.img "dist/TinyGPT-${tag}.img"
          cp tinygpt dist/tinygpt
          chmod +x dist/tinygpt
          zip -9 "dist/TinyGPT-${tag}-LICENSES.zip" \
            LICENSE THIRD_PARTY_NOTICES.md \
            firmware/licenses/EDK2-LICENSE.txt \
            firmware/licenses/LIBFDT-LICENSE.txt \
            firmware/licenses/OPENSSL-LICENSE.txt \
            third_party/PureDOOM/LICENSE \
            third_party/console-font/LICENSE.txt \
            assets/FREEDOOM-COPYING.txt \
            assets/FREEDOOM-CREDITS.txt \
            assets/FREEDOOM-CREDITS-MUSIC.txt \
            assets/FREEDOOM-README.html
          efi_size="$(stat -c '%s' "dist/${efi_name}")"
          efi_sha256="$(sha256sum "dist/${efi_name}" | cut -d ' ' -f 1)"
          cat > dist/TinyGPT-update.txt <<EOF
          version=${version}
          size=${efi_size}
          sha256=${efi_sha256}
          url=https://firesafetylite.github.io/TinyGPT/TinyGPT-latest-BOOTAA64.EFI
          EOF
          (
            cd dist
            test "$(grep -c '^' TinyGPT-update.txt)" -eq 4
            test "$(awk -F= '/^size=/{print $2}' TinyGPT-update.txt)" -eq "$(stat -c '%s' "${efi_name}")"
            test "$(awk -F= '/^sha256=/{print $2}' TinyGPT-update.txt)" = "$(sha256sum "${efi_name}" | cut -d ' ' -f 1)"
            sha256sum TinyGPT-* tinygpt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "TinyGPT ${tag}" \
              --generate-notes
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=release-published
